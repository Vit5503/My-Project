<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clone YT Homepage</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Link Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
</head>
<body>
    <div class="container">
        <!-- Header / Navbar -->
        <header>
            <nav class="navbar">
                <div class="nav-section nav-left">
                    <button class="nav-button menu-button">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <a href="#" class="nav-logo">
                        <img src="image/logo.png" alt="logo" class="logo-image">
                        <h2 class="logo-text">DVtube</h2>
                    </a>
                </div>

                <div class="nav-section nav-center">
                    <form action="#" class="search-form">
                        <input type="search" placeholder="Search" required class="search-input">
                        <button class="nav-button search-button">
                            <i class="fa-solid fa-search"></i>
                        </button>
                    </form>
                    <button class="nav-button mic-button">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                </div>

                <div class="nav-section nav-right">
                    <button class="nav-button theme-button">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <img src="image/user.jpg" alt="User Image" class="user-image">
                </div>
            </nav>
        </header>

        
    </div>
</body>
</html>
