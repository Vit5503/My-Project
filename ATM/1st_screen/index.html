<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Screen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <h1>Welcome</h1>
            <p>06 / March / 2026 | 4:00 PM</p>
        </nav>
    </header>
    <main>
        <p>CHOOSE ONE OPTIONS TO CONTINUE </p>
        <div class="options">
            <div class="opt_left ">
                <button class="btn">
                    <i>icon</i>
                    <P>TRANSFER FUNDS</P>
                    <span>Transfer Fund to another account</span>
                </button>
                <button class="btn">
                    <i>icon</i>
                    <P>BALANCE ENQUIRY</P>
                    <span>Check the balance of your account</span>
                </button>
                <button class="btn">
                    <i>icon</i>
                    <P>MINI STATEMENT</P>
                    <span>Get a statement of your account</span>
                </button>
                <button class="btn">
                    <i>icon</i>
                    <P>MOBILE RECHARGE</P>
                    <span>Recharge your mobile number</span>
                </button>
            </div>
            <div class="opt_right">
                <button class="btn">
                    <i>icon</i>
                    <P>FAST CASH</P>
                    <span>Get fast cash of selected value</span>
                </button>
                <button class="btn">
                    <i>icon</i>
                    <P>WITHDRAWAL</P>
                    <span>Withdarwal money from your account</span>
                </button>
                <button class="btn">
                    <i>icon</i>
                    <P>CASH DEPOSIT</P>
                    <span>Deposit cash into your account here</span>
                </button>
                <button class="btn">
                    <i>icon</i>
                    <P>PIN CHANGE</P>
                    <span>Change your ATM/Debit Card PIN</span>
                </button>
            </div>
        </div>
    </main>
</body>
</html>
